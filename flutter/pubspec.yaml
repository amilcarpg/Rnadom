name: decisor
description: App "Decisor" con varios modos de azar.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  google_mobile_ads: ^5.1.0
  go_router: ^14.1.2
  # vibration plugin temporalmente removido hasta integrar haptics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "../store-assets/tira-suerte-app-icon-512x512.png"

flutter:
  uses-material-design: true
  generate: true
