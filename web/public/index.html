<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061524" />
    <title>Tira Suerte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand"><h1>Tira <span>Suerte</span></h1></div>
        <div class="header-actions">
          <button id="history-button" class="icon-button" aria-label="Abrir historial" title="Historial">◷</button>
          <button id="settings-button" class="icon-button" aria-label="Abrir ajustes" title="Ajustes">⚙</button>
        </div>
      </header>

      <button id="mode-selector" class="mode-selector" type="button" aria-haspopup="dialog" aria-controls="mode-dialog">
        <span id="mode-selector-icon" aria-hidden="true"></span><span id="mode-selector-label"></span><span class="selector-chevron" aria-hidden="true">⌄</span>
      </button>

      <section id="mode-content" class="mode-content" aria-live="polite"></section>

      <footer class="app-footer">
        <p id="play-help" class="play-help" aria-live="polite"></p>
        <button type="button" id="play-button" class="play-button">JUGAR</button>
      </footer>
    </main>

    <dialog id="mode-dialog" class="sheet-dialog" aria-labelledby="mode-dialog-title">
      <div class="dialog-content mode-dialog-content">
        <div class="dialog-header"><h2 id="mode-dialog-title">Elige un modo</h2><button class="icon-button" type="button" data-close-dialog="mode-dialog" aria-label="Cerrar selector de modo">×</button></div>
        <div class="mode-list" role="list">
          <button type="button" class="mode-choice" data-mode="coin"><span class="mode-choice-icon" aria-hidden="true">☺</span><span><strong>Cara o sello</strong><small>Lanza una moneda al azar.</small></span><span class="mode-choice-check" aria-hidden="true">✓</span></button>
          <button type="button" class="mode-choice" data-mode="number"><span class="mode-choice-icon" aria-hidden="true">#</span><span><strong>Número aleatorio</strong><small>Sortea un número dentro de un rango.</small></span><span class="mode-choice-check" aria-hidden="true">✓</span></button>
          <button type="button" class="mode-choice" data-mode="wheel4"><span class="mode-choice-icon" aria-hidden="true">◉</span><span><strong>Ruleta 4 colores</strong><small>Gira una ruleta de cuatro colores.</small></span><span class="mode-choice-check" aria-hidden="true">✓</span></button>
          <button type="button" class="mode-choice" data-mode="custom"><span class="mode-choice-icon" aria-hidden="true">☷</span><span><strong>Ruleta personalizada</strong><small>Crea y gira tu propia ruleta.</small></span><span class="mode-choice-check" aria-hidden="true">✓</span></button>
        </div>
      </div>
    </dialog>

    <dialog id="custom-editor-dialog" class="sheet-dialog custom-editor-dialog" aria-labelledby="custom-editor-title">
      <div class="dialog-content custom-editor-content">
        <div class="dialog-header"><div><h2 id="custom-editor-title">Editar opciones</h2><p id="custom-editor-count" class="dialog-subtitle"></p></div><button class="icon-button" type="button" data-close-dialog="custom-editor-dialog" aria-label="Cerrar editor de opciones">×</button></div>
        <form id="add-option-form" class="add-form"><input id="option-label" maxlength="60" required placeholder="Nueva opción" aria-label="Texto de la opción" /><input id="option-color" class="color-input" type="color" value="#1ABC9C" aria-label="Color de la opción" /><button class="small-button" type="submit"><span aria-hidden="true">＋</span> Agregar</button></form>
        <ul id="custom-option-list" class="option-list" aria-label="Opciones de la ruleta"></ul>
      </div>
    </dialog>

    <dialog id="settings-dialog"><form method="dialog" class="dialog-content"><div class="dialog-header"><h2>Ajustes</h2><button class="icon-button" value="cancel" aria-label="Cerrar ajustes">×</button></div><label class="toggle-row"><span>Sonido</span><input id="sound-toggle" type="checkbox" role="switch" /></label><label class="toggle-row"><span>Vibración</span><input id="haptics-toggle" type="checkbox" role="switch" /></label></form></dialog>
    <dialog id="option-dialog"><form method="dialog" class="dialog-content"><div class="dialog-header"><h2 id="option-title">Opción</h2><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><label>Texto<input id="dialog-option-label" type="text" maxlength="60" required /></label><label>Color<input id="dialog-option-color" type="color" class="color-input" /></label><button id="save-option" class="small-button" value="default">Guardar</button></form></dialog>
    <dialog id="confirm-dialog"><form method="dialog" class="dialog-content"><h2>Eliminar opción</h2><p id="confirm-message"></p><div class="dialog-header"><button class="small-button" value="cancel">Cancelar</button><button id="confirm-action" class="small-button danger" value="default">Eliminar</button></div></form></dialog>
    <dialog id="history-dialog"><form method="dialog" class="dialog-content"><div class="dialog-header"><h2>Historial</h2><button class="icon-button" value="cancel" aria-label="Cerrar historial">×</button></div><button id="clear-history" class="small-button danger">Limpiar historial</button><ul id="history-list" class="option-list" aria-live="polite"></ul></form></dialog>

    <template id="option-template"><li class="option-row"><span class="option-dot" aria-hidden="true"></span><span class="option-label"></span><span class="option-actions"><button type="button" class="small-button edit-option" data-option-action="edit">Editar</button><button type="button" class="small-button danger remove-option" data-option-action="remove">Eliminar</button></span></li></template>
    <script src="data.js"></script><script src="app.js"></script>
  </body>
</html>
